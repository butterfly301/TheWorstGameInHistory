<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉吉网络官网</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header {
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #333;
        }
        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }
        .nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }
        .nav a:hover {
            color: #fff;
        }
        .hero {
            height: 60vh;
            background-image: url('Art/raji_banner.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            margin-top: 60px;
        }
        .hero-content h1 {
            font-size: 48px;
            margin: 0;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }
        .section {
            padding: 60px 0;
            border-bottom: 1px solid #222;
        }
        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 40px;
            color: #fff;
        }
        .about-content {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            font-size: 18px;
            color: #ccc;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }
        .game-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(255,255,255,0.1);
        }
        .game-cover {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .game-info {
            padding: 20px;
        }
        .game-title {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #fff;
        }
        .game-status {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }
        .status-released {
            background-color: #28a745;
            color: #fff;
        }
        .status-upcoming {
            background-color: #ffc107;
            color: #121212;
        }
        .footer {
            text-align: center;
            padding: 40px 0;
            color: #666;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container">
            <a href="#" class="logo">拉吉网络 (RajiNet)</a>
            <nav class="nav">
                <a href="#about">关于我们</a>
                <a href="#games">游戏作品</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>重塑现实的边界</h1>
            </div>
        </section>

        <section id="about" class="section">
            <div class="container">
                <h2 class="section-title">关于我们</h2>
                <div class="about-content">
                    <p>拉吉网络成立于数字纪元的黎明时期，我们致力于探索虚拟与现实的交汇点。我们的团队由一群充满激情的梦想家、艺术家和工程师组成，他们相信代码不仅能构建世界，更能赋予其灵魂。在这里，每一个像素都承载着一个故事，每一行代码都跳动着生命的脉搏。</p>
                </div>
            </div>
        </section>

        <section id="games" class="section">
            <div class="container">
                <h2 class="section-title">游戏作品</h2>
                <div class="games-grid">
                    <div class="game-card">
                        <img src="Art/tlk_1789_cover.jpg" alt="最后的勇者:1789 封面" class="game-cover">
                        <div class="game-info">
                            <h3 class="game-title">最后的勇者: 1789</h3>
                            <span class="game-status status-released">现已发售</span>
                        </div>
                    </div>
                    <div class="game-card">
                        <img src="Art/tlk_1793_cover.jpg" alt="最后的勇者2:1793 封面" class="game-cover">
                        <div class="game-info">
                            <h3 class="game-title">最后的勇者2: 1793</h3>
                            <span class="game-status status-upcoming">即将发售</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2077 拉吉网络 (RajiNet) 有限公司。保留所有权利。</p>
        </div>
    </footer>

</body>
</html>
