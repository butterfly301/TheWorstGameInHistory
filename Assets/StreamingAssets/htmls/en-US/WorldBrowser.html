            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

        }
        .main-container {
            display: flex;

            align-items: center;

        .logo {

            font-weight: bold;

        .logo .l { color: #34A853; }

        .search-form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .search-bar {
            display: flex;
            align-items: center;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            width: 580px;
            max-width: 90%;
            height: 44px;
            padding: 0 15px;
            margin-bottom: 30px;
        }
        .search-bar:hover, .search-bar:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,.28);
            border-color: rgba(223,225,229,0);
        }
        .search-bar input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background-color: transparent;
        }
        .search-icon {
            width: 20px;
            height: 20px;
            opacity: 0.5;
            margin-right: 10px;
        }

        .shortcuts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 360px;
            max-width: 90%;
        }
        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #3c4043;
            padding: 10px;
            border-radius: 8px;
        }
        .shortcut-item:hover {
            background-color: #f1f3f4;
        }
        .shortcut-icon-bg {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #f1f3f4;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }
        .shortcut-icon {
            width: 24px;
            height: 24px;
        }
        .shortcut-label {
